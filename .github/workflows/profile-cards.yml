name: Profile cards

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 05:17 Pakistan time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "fonts/**", "assets/**"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "fonttools>=4.47" pillow

      - name: Refresh contribution data
        env:
          # Add a PROFILE_TOKEN secret (classic PAT with repo + read:org) so private repos
          # you commit to stay current; the built-in token only sees public ones.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/fetch_data.py

      - name: Render cards
        run: python scripts/render_cards.py

      - name: Commit data and cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/contributions.json cards/ assets/ README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
